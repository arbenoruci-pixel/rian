name: One-time remove legacy arka day guards v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-remove-legacy-arka-day-guards-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch cycle-free payroll advances and retire day guards
        shell: bash
        run: |
          cat > /tmp/payrollAdvance.js <<'EOF'
          const PAYROLL_ADMIN_ROLE_KEYS = new Set([
            'ADMIN',
            'ADMIN_MASTER',
            'ADMINMASTER',
            'ADMINISTRATOR',
            'DISPATCH',
            'MASTER',
            'MASTER_USER',
            'MASTERUSER',
            'OWNER',
            'PRONAR',
            'SUPERADMIN',
            'SUPER_ADMIN',
          ]);

          function cleanText(value, fallback = '') {
            const text = String(value ?? '').trim();
            return text || fallback;
          }

          function normalizeRole(value) {
            return cleanText(value)
              .toUpperCase()
              .replace(/[^A-Z0-9]+/g, '_')
              .replace(/_+/g, '_')
              .replace(/^_|_$/g, '');
          }

          function normalizePin(value) {
            return cleanText(value).replace(/\D/g, '');
          }

          function roundMoney(value) {
            const amount = Number(String(value ?? '').replace(',', '.'));
            return Number.isFinite(amount) ? Math.round((amount + Number.EPSILON) * 100) / 100 : 0;
          }

          function isSchemaCompatibilityError(error) {
            const code = cleanText(error?.code).toUpperCase();
            const message = cleanText(error?.message || error?.details || error?.hint || error).toLowerCase();
            return code === '42703' ||
              code === 'PGRST204' ||
              code === 'PGRST202' ||
              message.includes('column') && (message.includes('does not exist') || message.includes('schema cache')) ||
              message.includes('could not find') && (message.includes('column') || message.includes('function'));
          }

          function buildActionId() {
            try {
              if (globalThis.crypto?.randomUUID) return globalThis.crypto.randomUUID();
            } catch {}
            return `${Date.now()}-${Math.random().toString(36).slice(2, 12)}`;
          }

          async function readVerifiedActor(supabase, actor) {
            const actorPin = normalizePin(actor?.pin);
            if (!actorPin) throw new Error('ACTOR_PIN_REQUIRED');

            let response = await supabase
              .from('users')
              .select('id,pin,name,role,is_active')
              .eq('pin', actorPin)
              .maybeSingle();

            if (response?.error && isSchemaCompatibilityError(response.error)) {
              response = await supabase
                .from('users')
                .select('id,pin,name,role')
                .eq('pin', actorPin)
                .maybeSingle();
            }

            if (response?.error) throw response.error;
            const user = response?.data;
            if (!user?.pin) throw new Error('ACTOR_NOT_FOUND');
            if (Object.prototype.hasOwnProperty.call(user, 'is_active') && user.is_active === false) {
              throw new Error('ACTOR_DISABLED');
            }

            const role = normalizeRole(user.role || actor?.role);
            const compactRole = role.replace(/_/g, '');
            if (!PAYROLL_ADMIN_ROLE_KEYS.has(role) && !PAYROLL_ADMIN_ROLE_KEYS.has(compactRole)) {
              throw new Error('ACTOR_ROLE_NOT_ALLOWED');
            }

            return {
              id: user.id || null,
              pin: normalizePin(user.pin),
              name: cleanText(user.name, cleanText(actor?.name, actorPin)),
              role,
            };
          }

          /**
           * Canonical payroll advance writer.
           *
           * This path intentionally has no arka day/cycle lookup, no open/close RPC,
           * and never writes cycle_id/applied_cycle_id. Historical cycle data stays
           * untouched and read-only.
           */
          export async function createPayrollAdvanceCycleFree({
            supabase,
            actor,
            worker,
            amount,
            note = 'AVANS',
          } = {}) {
            if (!supabase?.from) throw new Error('SUPABASE_CLIENT_REQUIRED');

            const verifiedActor = await readVerifiedActor(supabase, actor || {});
            const workerPin = normalizePin(worker?.pin);
            const workerName = cleanText(worker?.name, workerPin);
            const cleanAmount = roundMoney(amount);
            if (!workerPin || !workerName) throw new Error('WORKER_REQUIRED');
            if (!(cleanAmount > 0)) throw new Error('ADVANCE_AMOUNT_REQUIRED');

            const now = new Date().toISOString();
            const actionId = `payroll-advance:${workerPin}:${buildActionId()}`;
            const cleanNote = cleanText(note, 'AVANS');

            const fullRow = {
              amount: cleanAmount,
              type: 'ADVANCE',
              status: 'ADVANCE',
              method: 'CASH',
              note: cleanNote,
              created_by_pin: workerPin,
              created_by_name: workerName,
              created_by_role: 'WORKER',
              actor_pin: verifiedActor.pin,
              actor_name: verifiedActor.name,
              source: 'PAYROLL',
              source_module: 'ARKA',
              source_ref: actionId,
              idempotency_key: actionId,
              client_name: workerName,
              created_at: now,
              updated_at: now,
            };

            const variants = [
              fullRow,
              {
                amount: cleanAmount,
                type: 'ADVANCE',
                status: 'ADVANCE',
                note: cleanNote,
                created_by_pin: workerPin,
                created_by_name: workerName,
                actor_pin: verifiedActor.pin,
                actor_name: verifiedActor.name,
                source_module: 'ARKA',
                idempotency_key: actionId,
                client_name: workerName,
                created_at: now,
              },
              {
                amount: cleanAmount,
                type: 'ADVANCE',
                status: 'ADVANCE',
                note: cleanNote,
                created_by_pin: workerPin,
                created_by_name: workerName,
                client_name: workerName,
                created_at: now,
              },
            ];

            let lastError = null;
            for (const row of variants) {
              const { error } = await supabase.from('arka_pending_payments').insert(row);
              if (!error) {
                return {
                  ok: true,
                  amount: cleanAmount,
                  workerPin,
                  workerName,
                  actorPin: verifiedActor.pin,
                  actorName: verifiedActor.name,
                  actionId,
                };
              }
              lastError = error;
              if (isSchemaCompatibilityError(error)) continue;
              throw error;
            }

            throw lastError || new Error('PAYROLL_ADVANCE_INSERT_FAILED');
          }
          EOF

          mkdir -p lib/arka
          cp /tmp/payrollAdvance.js lib/arka/payrollAdvance.js

          python3 - <<'PY'
          from pathlib import Path
          import re

          payroll = Path('app/arka/payroll/page.jsx')
          s = payroll.read_text()
          original = s

          import_line = 'import { createPayrollAdvanceCycleFree } from "@/lib/arka/payrollAdvance";\n'
          if import_line not in s:
              anchor = 'import { arkaTransaction, buildArkaIdempotencyKey } from "@/lib/arka/arkaClient";\n'
              if anchor not in s:
                  raise SystemExit('Payroll arkaClient import anchor not found')
              s = s.replace(anchor, anchor + import_line, 1)

          # Every authenticated payroll administrator role may manage payroll actions.
          old_roles = "['ADMIN', 'ADMIN_MASTER', 'DISPATCH', 'OWNER', 'PRONAR', 'SUPERADMIN']"
          new_roles = "['ADMIN', 'ADMIN_MASTER', 'ADMINISTRATOR', 'DISPATCH', 'MASTER', 'MASTER_USER', 'OWNER', 'PRONAR', 'SUPERADMIN']"
          s = s.replace(old_roles, new_roles)
          old_boot_roles = '["ADMIN", "ADMIN_MASTER", "DISPATCH", "OWNER", "PRONAR", "SUPERADMIN"]'
          new_boot_roles = '["ADMIN", "ADMIN_MASTER", "ADMINISTRATOR", "DISPATCH", "MASTER", "MASTER_USER", "OWNER", "PRONAR", "SUPERADMIN"]'
          s = s.replace(old_boot_roles, new_boot_roles)

          start = s.find('  async function handleAddAdvance()')
          end = s.find('\n  const payableAmount', start)
          if start < 0 or end < 0:
              raise SystemExit('handleAddAdvance block not found')
          block = s[start:end]

          old_call = '''      await arkaTransaction({
                action: ARKA_ACTION.EXPENSE_REQUEST,
                actorPin: actor?.pin || advanceModal?.pin || null,
                actorName: actor?.name || null,
                actorRole: actor?.role || null,
                workerPin: advanceModal?.pin || null,
                workerName: advanceModal?.name || null,
                paymentType: 'ADVANCE',
                sourceModule: ARKA_SOURCE_MODULE.ARKA,
                status: 'ADVANCE',
                amount: amt,
                note: String(advanceNote || 'AVANS').trim() || 'AVANS',
                idempotencyKey: buildArkaIdempotencyKey(ARKA_ACTION.EXPENSE_REQUEST, [advanceModal?.pin || '', 'ADVANCE', amt]),
              });'''
          if old_call not in block:
              # Current formatter uses six spaces before object fields.
              old_call = '''      await arkaTransaction({
                action: ARKA_ACTION.EXPENSE_REQUEST,
                actorPin: actor?.pin || advanceModal?.pin || null,
                actorName: actor?.name || null,
                actorRole: actor?.role || null,
                workerPin: advanceModal?.pin || null,
                workerName: advanceModal?.name || null,
                paymentType: 'ADVANCE',
                sourceModule: ARKA_SOURCE_MODULE.ARKA,
                status: 'ADVANCE',
                amount: amt,
                note: String(advanceNote || 'AVANS').trim() || 'AVANS',
                idempotencyKey: buildArkaIdempotencyKey(ARKA_ACTION.EXPENSE_REQUEST, [advanceModal?.pin || '', 'ADVANCE', amt]),
              });'''

          if old_call not in block:
              call_start = block.find('      await arkaTransaction({')
              if call_start < 0:
                  raise SystemExit('Legacy advance arkaTransaction call not found')
              depth = 0
              call_end = None
              i = call_start
              while i < len(block):
                  if block[i] == '{':
                      depth += 1
                  elif block[i] == '}':
                      depth -= 1
                      if depth == 0:
                          semi = block.find(';', i)
                          call_end = semi + 1
                          break
                  i += 1
              if call_end is None:
                  raise SystemExit('Could not parse legacy advance arkaTransaction call')
              old_call = block[call_start:call_end]

          new_call = '''      await createPayrollAdvanceCycleFree({
                supabase,
                actor,
                worker: advanceModal,
                amount: amt,
                note: String(advanceNote || 'AVANS').trim() || 'AVANS',
              });'''
          block = block.replace(old_call, new_call, 1)
          s = s[:start] + block + s[end:]

          # The daily close shortcut belongs to the retired day-cycle workflow.
          s = re.sub(
              r'\s*<Link\s+prefetch=\{false\}\s+href="/arka/ditore"\s+className="navBtn">MBYLLJA DITORE</Link>',
              '',
              s,
              count=1,
          )

          if s == original:
              raise SystemExit('Payroll patch made no changes')
          if 'createPayrollAdvanceCycleFree' not in s:
              raise SystemExit('Cycle-free advance helper was not wired')

          payroll.write_text(s)

          guards = Path('lib/arka/arkaGuards.js')
          g = guards.read_text()
          if 'export function isLegacyArkaDayGuardError' not in g:
              marker = 'export function isMissingColumnOrFunctionError'
              pos = g.find(marker)
              if pos < 0:
                  raise SystemExit('isMissingColumnOrFunctionError marker not found')
              helper = '''export function isLegacyArkaDayGuardError(error) {
            const message = String(error?.message || error?.details || error?.hint || error || '').toLowerCase();
            return message.includes('arka_day_already_closed') ||
              message.includes('day_already_closed') ||
              message.includes('arka day already closed') ||
              message.includes('arka është mbyllur') ||
              message.includes('arka eshte mbyllur');
          }

          '''
              g = g[:pos] + helper + g[pos:]

          match = re.search(r'export function isMissingColumnOrFunctionError\(([^)]*)\)\s*\{', g)
          if not match:
              raise SystemExit('Could not locate compatibility guard function')
          param = match.group(1).split(',')[0].strip() or 'error'
          injection = f"\n  if (isLegacyArkaDayGuardError({param})) return true;"
          body_start = match.end()
          if injection.strip() not in g[body_start:body_start + 240]:
              g = g[:body_start] + injection + g[body_start:]
          guards.write_text(g)

          engine = Path('lib/arka/arkaEngine.js')
          e = engine.read_text()
          if 'isLegacyArkaDayGuardError,' not in e:
              anchor = '  isMissingColumnOrFunctionError,\n'
              if anchor not in e:
                  raise SystemExit('arkaEngine guard import anchor not found')
              e = e.replace(anchor, '  isLegacyArkaDayGuardError,\n' + anchor, 1)

          rpc_fn = re.search(r"function isMissingRpcFunctionError\(error, functionName = ''\) \{", e)
          if not rpc_fn:
              raise SystemExit('isMissingRpcFunctionError function not found')
          rpc_insert = '\n  if (isLegacyArkaDayGuardError(error)) return true;'
          rpc_pos = rpc_fn.end()
          if rpc_insert.strip() not in e[rpc_pos:rpc_pos + 220]:
              e = e[:rpc_pos] + rpc_insert + e[rpc_pos:]

          pending_marker = 'function pendingInsertVariants(payload = {}) {'
          pending_pos = e.find(pending_marker)
          if pending_pos < 0:
              raise SystemExit('pendingInsertVariants not found')
          pending_body = pending_pos + len(pending_marker)
          strip_line = "\n  payload = stripKeys(payload, ['cycle_id', 'applied_cycle_id']);"
          if strip_line.strip() not in e[pending_body:pending_body + 220]:
              e = e[:pending_body] + strip_line + e[pending_body:]

          engine.write_text(e)
          PY

      - name: Verify legacy guard removal
        shell: bash
        run: |
          grep -n "createPayrollAdvanceCycleFree" app/arka/payroll/page.jsx lib/arka/payrollAdvance.js
          grep -n "isLegacyArkaDayGuardError" lib/arka/arkaGuards.js lib/arka/arkaEngine.js
          ! sed -n '/async function handleAddAdvance()/,/const payableAmount/p' app/arka/payroll/page.jsx | grep -q "ARKA_ACTION.EXPENSE_REQUEST"
          ! sed -n '/async function handleAddAdvance()/,/const payableAmount/p' app/arka/payroll/page.jsx | grep -q "cycle_id\|applied_cycle_id\|arka_cycles\|is_closed"
          ! grep -q 'href="/arka/ditore" className="navBtn">MBYLLJA DITORE' app/arka/payroll/page.jsx
          node --check lib/arka/payrollAdvance.js
          node --check lib/arka/arkaGuards.js
          node --check lib/arka/arkaEngine.js

      - name: Build application
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Commit cycle-free arka runtime
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/arka/payroll/page.jsx lib/arka/payrollAdvance.js lib/arka/arkaGuards.js lib/arka/arkaEngine.js
          git commit -m 'fix: retire legacy arka day guards from payroll advances'
          git push origin main
