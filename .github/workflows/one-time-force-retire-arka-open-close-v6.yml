name: One-time force retire arka open-close v6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-force-retire-arka-open-close-v6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Apply and verify patch
        run: |
          python3 scripts/retire_arka_open_close_runtime.py
          node --check lib/arka/payrollAdvance.js
          node --check lib/arka/arkaGuards.js
          node --check lib/arka/arkaEngine.js
          grep -q "createPayrollAdvanceCycleFree" app/arka/payroll/page.jsx
          ! sed -n '/async function handleAddAdvance()/,/const payableAmount/p' app/arka/payroll/page.jsx | grep -q 'ARKA_ACTION.EXPENSE_REQUEST'
          ! sed -n '/async function handleAddAdvance()/,/const payableAmount/p' app/arka/payroll/page.jsx | grep -q 'cycle_id\|applied_cycle_id\|arka_cycles\|is_closed'

      - name: Commit and push source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Patch already present."
            exit 0
          fi
          git commit -m "fix: remove legacy arka day guards"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git reset --hard origin/main; python3 scripts/retire_arka_open_close_runtime.py; git add -A; git commit -m "fix: remove legacy arka day guards"; }
          done
          exit 1
