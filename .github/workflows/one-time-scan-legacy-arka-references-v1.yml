name: Inventory legacy ARKA references

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-scan-legacy-arka-references-v1.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Search all tracked source files
        run: |
          set +e
          git grep -n -I -E \
            'apply-arka-daily-(close-v2|control-v1|expense-step-v1|operations-v3)|verify-arka-daily-(close-v2|control-v1|expense-step-v1|operations-v3)|test:arka-daily-(close-v2|control|expense-step-v1|operations-v3)|ARKA_DAILY_CLOSE_V2_ONE_WAY|ARKA_DAY_ALREADY_CLOSED|arka_open_cycle_safe|get_arka_daily_close_preview|close_arka_day_v2|add_arka_closed_day_expense_v1|ArkaDailyClose(Shortcut|Wizard)|/arka/ditore' \
            -- ':!supabase/migrations/**' ':!app/arka/ditore/page.jsx' ':!src/generated/routes.generated.jsx' \
            > LEGACY_ARKA_REFERENCE_INVENTORY.txt
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          printf '\nTOTAL LINES: ' >> LEGACY_ARKA_REFERENCE_INVENTORY.txt
          wc -l < LEGACY_ARKA_REFERENCE_INVENTORY.txt >> LEGACY_ARKA_REFERENCE_INVENTORY.txt
          cat LEGACY_ARKA_REFERENCE_INVENTORY.txt
      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LEGACY_ARKA_REFERENCE_INVENTORY.txt
          git commit -m "chore: inventory legacy ARKA references"
          git pull --rebase origin main
          git push origin main
