name: One-time remove offline mirror banner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-find-mirror-banner.yml

permissions:
  contents: write

jobs:
  remove-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove banner and commit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/offlineRuntime.js')
          text = path.read_text()
          text = text.replace("export const OFFLINE_RUNTIME_VERSION = 'offline-first-runtime-v1';", "export const OFFLINE_RUNTIME_VERSION = 'offline-first-runtime-v2-no-banner';")
          pattern = re.compile(r"function renderBanner\(\) \{.*?\n\}\n\nfunction persistRuntimeState\(\)", re.S)
          replacement = """function renderBanner() {
            // The offline runtime remains active in the background. Its fixed status
            // banner was removed because it covered operational buttons on mobile.
            if (!isBrowser()) return;
            if (bannerNode) {
              try { bannerNode.remove(); } catch {}
              bannerNode = null;
            }
            try {
              document.getElementById('tepiha-offline-runtime-banner-v1')?.remove?.();
            } catch {}
          }

          function persistRuntimeState()"""
          next_text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one renderBanner block, replaced {count}')
          path.write_text(next_text)
          PY
          rm -f .tmp-mirror-banner-locations.txt
          rm .github/workflows/one-time-find-mirror-banner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/offlineRuntime.js .github/workflows/one-time-find-mirror-banner.yml .tmp-mirror-banner-locations.txt || true
          git commit -m "remove offline mirror status banner"
          git push origin HEAD:main
