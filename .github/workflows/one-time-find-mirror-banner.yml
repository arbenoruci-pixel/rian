name: One-time find mirror banner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-find-mirror-banner.yml

permissions:
  contents: write

jobs:
  find-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find and commit locator report
        shell: bash
        run: |
          grep -Rni --exclude-dir=.git --exclude-dir=node_modules --exclude='*.map' -E 'PASQYRA E FUNDIT|Pasqyra:|Kode B:|Në pritje:|Ne pritje:' . > .tmp-mirror-banner-locations.txt || true
          rm .github/workflows/one-time-find-mirror-banner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-mirror-banner-locations.txt .github/workflows/one-time-find-mirror-banner.yml
          git commit -m "locate mirror banner source"
          git push origin HEAD:main
