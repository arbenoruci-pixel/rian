name: One-time finalize Dispatch phone PWA identity v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-finalize-dispatch-phone-pwa-identity-v2.yml'

permissions:
  contents: write

concurrency:
  group: one-time-finalize-dispatch-phone-pwa-identity-v2
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Keep the phone fix as the final PWA identity layer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          final_import = "await import('./apply-dispatch-phone-check-final-identity-v2.mjs');"
          marker = 'DISPATCH_PHONE_CHECK_FINAL_IDENTITY_V2'

          gati_path = Path('tools/apply-gati-rack-save-v1.mjs')
          source = gati_path.read_text()
          if final_import not in source:
              source = source.rstrip() + "\n\n// " + marker + ": run after all nested legacy release writers.\n" + final_import + "\n"
          gati_path.write_text(source)

          installer_path = Path('tools/apply-dispatch-phone-check-resilience-v2.mjs')
          source = installer_path.read_text()
          anchor = "  if (!source.includes(TAG)) throw new Error('FINAL_VERSION_OWNER_TAG_MISSING');"
          patch = "  const finalIdentityImport = \"await import('./apply-dispatch-phone-check-final-identity-v2.mjs');\";\n  if (!source.includes(finalIdentityImport)) {\n    source = `${source.trimEnd()}\\n\\n// DISPATCH_PHONE_CHECK_FINAL_IDENTITY_V2: run after nested legacy release writers.\\n${finalIdentityImport}\\n`;\n  }\n" + anchor
          if 'const finalIdentityImport =' not in source:
              if anchor not in source:
                  raise SystemExit('FINAL_IDENTITY_INSTALLER_ANCHOR_NOT_FOUND')
              source = source.replace(anchor, patch, 1)
          installer_path.write_text(source)

          verifier_path = Path('tools/verify-dispatch-phone-check-resilience-v2.mjs')
          source = verifier_path.read_text()
          read_anchor = "const gatiOwner = fs.readFileSync('tools/apply-gati-rack-save-v1.mjs', 'utf8');"
          read_line = read_anchor + "\nconst finalIdentity = fs.readFileSync('tools/apply-dispatch-phone-check-final-identity-v2.mjs', 'utf8');"
          if "const finalIdentity = fs.readFileSync" not in source:
              if read_anchor not in source:
                  raise SystemExit('FINAL_IDENTITY_VERIFIER_READ_ANCHOR_NOT_FOUND')
              source = source.replace(read_anchor, read_line, 1)
          check_anchor = "check(gatiOwner.includes('sw-navigation-diag.js?v=3514'), 'service-worker generation was not bumped');"
          check_lines = check_anchor + "\ncheck(gatiOwner.includes(\"apply-dispatch-phone-check-final-identity-v2.mjs\"), 'final identity layer is not called after nested release writers');\ncheck(finalIdentity.includes('DISPATCH_PHONE_CHECK_FINAL_IDENTITY_V2'), 'final identity script marker missing');"
          if 'final identity layer is not called after nested release writers' not in source:
              if check_anchor not in source:
                  raise SystemExit('FINAL_IDENTITY_VERIFIER_CHECK_ANCHOR_NOT_FOUND')
              source = source.replace(check_anchor, check_lines, 1)
          verifier_path.write_text(source)
          PY

      - name: Apply and verify the final identity
        run: |
          node --check tools/apply-dispatch-phone-check-final-identity-v2.mjs
          node --check tools/apply-dispatch-phone-check-resilience-v2.mjs
          node tools/apply-dispatch-phone-check-resilience-v2.mjs
          node tools/apply-dispatch-phone-check-final-identity-v2.mjs
          node tools/verify-dispatch-phone-check-resilience-v2.mjs
          node tools/verify-home-search-local-oid-dedupe-v1.mjs
          node tools/verify-arka-daily-operations-v3.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/apply-gati-rack-save-v1.mjs \
            tools/apply-dispatch-phone-check-resilience-v2.mjs \
            tools/verify-dispatch-phone-check-resilience-v2.mjs \
            package.json \
            vite.config.js \
            lib/appEpoch.js \
            index.html \
            public/sw.js
          if git diff --cached --quiet; then
            echo "Final identity patch already present."
            exit 0
          fi
          git commit -m "fix: ship Dispatch phone resilience to installed PWAs"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
