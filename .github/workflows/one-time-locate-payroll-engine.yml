name: One-time locate payroll engine
on:
  push:
    branches: [main]
    paths: [.github/workflows/one-time-locate-payroll-engine.yml]
permissions:
  contents: write
jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          {
            grep -n -B 20 -A 220 -E 'function payrollSalaryPayment|async function payrollSalaryPayment|assertActorAllowed' lib/arka/arkaEngine.js || true
            echo '=== PAYROLL UI CASH FIELDS ==='
            grep -n -B 8 -A 20 -E 'cash.*worker|worker.*cash|pendingCash|cashToHand|handoff|SALARY' app/arka/payroll/page.jsx | head -n 500 || true
          } > .tmp-payroll-engine-context.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-payroll-engine-context.txt
          git commit -m "locate payroll engine and worker cash context"
          git push origin HEAD:main
