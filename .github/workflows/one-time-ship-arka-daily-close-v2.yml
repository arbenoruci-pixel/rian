name: One-time ship ARKA daily close V2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-ship-arka-daily-close-v2.yml

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply canonical one-way ARKA flow
        run: node tools/apply-arka-daily-close-v2.mjs

      - name: Verify canonical source
        run: node tools/verify-arka-daily-close-v2.mjs

      - name: Run full production build
        run: npm run build

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/arka/page.jsx \
            app/arka/ditore/page.jsx \
            components/ArkaDailyCloseWizard.jsx \
            tools/apply-arka-daily-close-v2.mjs \
            tools/verify-arka-daily-close-v2.mjs \
            package.json \
            vite.config.js \
            lib/appEpoch.js \
            index.html
          if git diff --cached --quiet; then
            echo "No generated source changes to commit."
          else
            git commit -m "activate one-way ARKA daily close V2"
            git push origin HEAD:main
          fi
