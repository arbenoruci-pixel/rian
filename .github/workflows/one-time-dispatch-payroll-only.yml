name: One-time dispatch payroll only
on:
  push:
    branches: [main]
    paths: [.github/workflows/one-time-dispatch-payroll-only.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/arka/payroll/page.jsx')
          s=p.read_text()
          anchor="  const normalizedRole = String(actor?.role || '').toUpperCase();\n  const isAdminUser = ['ADMIN', 'ADMIN_MASTER', 'DISPATCH', 'OWNER', 'PRONAR', 'SUPERADMIN'].includes(normalizedRole);"
          repl=anchor+"\n  const isDispatchUser = normalizedRole === 'DISPATCH';\n  const payrollActorPin = String(isDispatchUser ? (actor?.pin || '') : (masterPin || actor?.pin || '')).trim();"
          if "const payrollActorPin" not in s:
            if anchor not in s: raise SystemExit('role anchor missing')
            s=s.replace(anchor,repl,1)
          old='''    if (!salaryModal || !masterPin) {\n      alert("Kërkohet Master PIN për pagesën e rrogës.");\n      return;\n    }'''
          new='''    if (!salaryModal || !payrollActorPin) {\n      alert(isDispatchUser ? "Mungon PIN-i i Dispatch-it. Hyni përsëri në aplikacion." : "Kërkohet Master PIN për pagesën e rrogës.");\n      return;\n    }'''
          if old in s: s=s.replace(old,new,1)
          s=s.replace("actorPin: String(masterPin || '').trim(),","actorPin: payrollActorPin,",1)
          s=s.replace("actorName: actor?.name || 'MASTER USER',","actorName: actor?.name || (isDispatchUser ? 'DISPATCH' : 'MASTER USER'),",1)
          p.write_text(s)
          p=Path('lib/appEpoch.js'); t=p.read_text(); t=re.sub(r"export const APP_VERSION = '[^']+';", "export const APP_VERSION = '2.0.66-dispatch-payroll-only-v1';", t, count=1); p.write_text(t)
          p=Path('package.json'); t=p.read_text(); t=re.sub(r'"version": "[^"]+"','"version": "2.0.66-dispatch-payroll-only-v1"',t,count=1); p.write_text(t)
          PY
          npm run build
          rm -f .github/workflows/one-time-dispatch-payroll-only.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/arka/payroll/page.jsx lib/appEpoch.js package.json .github/workflows/one-time-dispatch-payroll-only.yml
          git commit -m "allow dispatch salary payments with own pin only"
          git push origin HEAD:main
