name: One-time ship home search BASE role boundary V1

# Retry 2: remove the legacy getKind definition after installing the authoritative classifier.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-ship-home-search-base-role-boundary-v1.yml

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply final BASE versus Transport role boundary
        run: node tools/apply-home-search-base-role-boundary-v1.mjs

      - name: Verify targeted regression fixtures
        run: node tools/verify-home-search-base-role-boundary-v1.mjs

      - name: Run full production build
        run: npm run build

      - name: Commit verified generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/homeSearch.js \
            app/page.jsx \
            tools/apply-home-search-base-role-boundary-v1.mjs \
            tools/verify-home-search-base-role-boundary-v1.mjs \
            tools/apply-arka-daily-close-v2.mjs \
            tools/verify-arka-daily-close-v2.mjs \
            package.json \
            vite.config.js \
            lib/appEpoch.js \
            index.html
          if git diff --cached --quiet; then
            echo "No generated source changes to commit."
          else
            git commit -m "fix Home search BASE versus Transport role boundary"
            git push origin HEAD:main
          fi
