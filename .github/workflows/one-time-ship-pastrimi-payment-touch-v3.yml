name: One-time ship Pastrimi payment touch V3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-ship-pastrimi-payment-touch-v3.yml

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Pastrimi payment touch V3
        run: node tools/apply-pastrimi-payment-touch-v3.mjs

      - name: Verify targeted payment interaction
        run: node tools/verify-pastrimi-payment-touch-v3.mjs

      - name: Run full production build
        run: npm run build

      - name: Commit verified generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/pastrimi/page.jsx \
            components/PosModal.jsx \
            tools/apply-pastrimi-payment-touch-v3.mjs \
            tools/verify-pastrimi-payment-touch-v3.mjs \
            tools/apply-gati-rack-save-v1.mjs \
            tools/verify-gati-rack-save-v1.mjs \
            tools/apply-arka-daily-close-v2.mjs \
            tools/verify-arka-daily-close-v2.mjs \
            package.json \
            vite.config.js \
            lib/appEpoch.js \
            index.html
          if git diff --cached --quiet; then
            echo "No generated source changes to commit."
          else
            git commit -m "fix Pastrimi payment button touch and stale busy state"
            git push origin HEAD:main
          fi
