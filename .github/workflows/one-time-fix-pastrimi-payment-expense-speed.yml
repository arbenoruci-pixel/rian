name: One-time fix Pastrimi payment and expense speed

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-fix-pastrimi-payment-expense-speed.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused fixes and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1. Payment writes: fail over to durable queue quickly and allow legitimate
          # repeated equal payments on the same order.
          p = Path('components/payments/payService.js')
          s = p.read_text()
          old = """      buildArkaIdempotencyKey(ARKA_ACTION.BASE_ORDER_PAYMENT, [orderId, amt, actor.pin]),
  });"""
          new = """      buildArkaIdempotencyKey(ARKA_ACTION.BASE_ORDER_PAYMENT, [orderId, amt, actor.pin], { randomSuffix: true }),
  }, {
    timeoutMs: 7000,
    maxAttempts: 1,
    retryDelaysMs: [],
  });"""
          if old not in s:
            raise SystemExit('payService target not found')
          p.write_text(s.replace(old, new, 1))

          # 2. Expense writes: same-amount expenses must be separate requests; queue
          # quickly instead of blocking workers through multiple long retries.
          p = Path('lib/arkaService.js')
          s = p.read_text()
          old = """    idempotencyKey: buildArkaIdempotencyKey(ARKA_ACTION.EXPENSE_REQUEST, [actorPin, 'EXPENSE', amt]),
  });
  return res?.payment || res?.row || null;"""
          new = """    idempotencyKey: buildArkaIdempotencyKey(ARKA_ACTION.EXPENSE_REQUEST, [actorPin, 'EXPENSE', amt], { randomSuffix: true }),
  }, {
    timeoutMs: 7000,
    maxAttempts: 1,
    retryDelaysMs: [],
  });
  return res?.payment || res?.row || (res?.queued ? { queued: true, offlineQueued: true, id: res?.queuedOpId || res?.idempotencyKey || null } : null);"""
          if old not in s:
            raise SystemExit('arkaService expense target not found')
          p.write_text(s.replace(old, new, 1))

          # 3. Pastrimi UI: queued payments are a valid pending state. Close the sheet
          # immediately after queueing and do not leave the worker trapped behind an error.
          p = Path('app/pastrimi/page.jsx')
          s = p.read_text()
          old1 = """        if (!payRes?.ok || !payRes?.payment || !payRes?.order) throw new Error(payRes?.error || 'ARKA_VERIFY_FAILED');
        const pay = payRes?.order?.data?.pay || {};"""
          new1 = """        if (payRes?.queued || payRes?.offlineQueued || payRes?.pending && !payRes?.order) {
          setShowPaySheet(false);
          alert('⏳ PAGESA U RUAJT NË PRITJE DHE DO TË SINKRONIZOHET AUTOMATIKISHT.');
          return;
        }
        if (!payRes?.ok || !payRes?.payment || !payRes?.order) throw new Error(payRes?.error || 'ARKA_VERIFY_FAILED');
        const pay = payRes?.order?.data?.pay || {};"""
          if old1 not in s:
            raise SystemExit('pastrimi edit payment target not found')
          s = s.replace(old1, new1, 1)

          old2 = """      if (!payRes?.ok || !payRes?.payment || !payRes?.order) throw new Error(payRes?.error || 'ARKA_VERIFY_FAILED');
      const engineOrder = payRes.order;"""
          new2 = """      if (payRes?.queued || payRes?.offlineQueued || payRes?.pending && !payRes?.order) {
        setRowPaySheet(false);
        setRowPayOrder(null);
        setRowPayAmount(0);
        alert('⏳ PAGESA U RUAJT NË PRITJE DHE DO TË SINKRONIZOHET AUTOMATIKISHT.');
        return;
      }
      if (!payRes?.ok || !payRes?.payment || !payRes?.order) throw new Error(payRes?.error || 'ARKA_VERIFY_FAILED');
      const engineOrder = payRes.order;"""
          if old2 not in s:
            raise SystemExit('pastrimi row payment target not found')
          p.write_text(s.replace(old2, new2, 1))

          # Version/cache bump for installed iPhone PWA.
          p = Path('lib/appEpoch.js')
          s = p.read_text()
          import re
          s = re.sub(r"export const APP_VERSION = '[^']+';", "export const APP_VERSION = '2.0.64-payment-expense-fast-v1';", s, count=1)
          p.write_text(s)

          p = Path('package.json')
          s = p.read_text()
          s = re.sub(r'"version": "[^"]+"', '"version": "2.0.64-payment-expense-fast-v1"', s, count=1)
          p.write_text(s)

          p = Path('vite.config.js')
          s = p.read_text()
          s = re.sub(r"sw-navigation-diag\.js\?v=\d+", "sw-navigation-diag.js?v=3504", s, count=1)
          s = s.replace('tepiha-vite-business-routes-v39-offline-queued-success', 'tepiha-vite-business-routes-v40-payment-expense-fast')
          s = s.replace('tepiha-vite-static-assets-v39-offline-queued-success', 'tepiha-vite-static-assets-v40-payment-expense-fast')
          s = s.replace('tepiha-vite-media-v39-offline-queued-success', 'tepiha-vite-media-v40-payment-expense-fast')
          p.write_text(s)
          PY

          npm run build
          rm -f .github/workflows/one-time-analyze-payment-expense-blocks.yml .tmp-payment-expense-analysis.txt
          rm .github/workflows/one-time-fix-pastrimi-payment-expense-speed.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/payments/payService.js lib/arkaService.js app/pastrimi/page.jsx lib/appEpoch.js package.json vite.config.js .github/workflows/one-time-analyze-payment-expense-blocks.yml .tmp-payment-expense-analysis.txt .github/workflows/one-time-fix-pastrimi-payment-expense-speed.yml || true
          git commit -m "speed up Pastrimi payments and worker expenses"
          git push origin HEAD:main
