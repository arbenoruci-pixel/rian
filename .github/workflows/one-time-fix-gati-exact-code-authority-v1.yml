name: One-time fix GATI exact code authority v1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-fix-gati-exact-code-authority-v1.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Apply exact-code authority fix
        run: node tools/apply-gati-exact-code-authority-v1.mjs

      - name: Verify targeted invariants
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const gati = fs.readFileSync('app/gati/page.jsx', 'utf8');
          const home = fs.readFileSync('lib/homeSearch.js', 'utf8');
          const checks = [
            [gati.includes('GATI_EXACT_CODE_AUTHORITY_V1'), 'GATI marker missing'],
            [gati.includes('const codeMatch = !!wantedCode && rowCode === wantedCode;'), 'GATI exact code fallback missing'],
            [gati.includes('[orders, search, exactMode, openId, openCode]'), 'GATI exact dependency missing'],
            [home.includes('HOME_SEARCH_TYPED_BASE_CODE_AUTHORITY_V1'), 'HOME typed-code authority marker missing'],
            [home.indexOf("if (kind === 'BASE' && queryBaseCode)") < home.indexOf("if (!row && kind === 'BASE' && id && /^\\d+$/.test(id))"), 'HOME still trusts cached id before typed code'],
          ];
          const failures = checks.filter(([ok]) => !ok).map(([, message]) => message);
          if (failures.length) {
            failures.forEach((message) => console.error('FAIL', message));
            process.exit(1);
          }
          console.log('PASS GATI exact-code authority v1 targeted invariants');
          NODE

      - name: Full regression build
        run: |
          npm ci
          npm run build

      - name: Commit verified fix
        run: |
          if git diff --quiet -- app/gati/page.jsx lib/homeSearch.js; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/gati/page.jsx lib/homeSearch.js
          git commit -m 'fix: make GATI exact open code-authoritative'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
