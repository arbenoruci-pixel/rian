name: One-time ship transport repeat visit V2

# Retry 4: installer is made idempotent before npm prebuild runs it again.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-ship-transport-repeat-visit-v2.yml

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply and full-build with diagnostics
        shell: bash
        run: |
          set +e
          LOG=/tmp/repeat-visit-v2.log
          : > "$LOG"
          run_step() {
            echo "===== $1 =====" | tee -a "$LOG"
            shift
            "$@" >> "$LOG" 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "FAILED rc=$rc" | tee -a "$LOG"
              cp "$LOG" repeat-visit-v2-workflow.log
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add repeat-visit-v2-workflow.log
              git commit -m "diagnose repeat visit V2 build failure" || true
              git push origin HEAD:main || true
              exit $rc
            fi
          }
          run_step APPLY node tools/apply-transport-repeat-visit-v2.mjs
          run_step IDEMPOTENCE node tools/fix-transport-repeat-visit-v2-idempotence.mjs
          run_step BOOTSTRAP node tools/fix-transport-repeat-visit-v2-bootstrap.mjs
          run_step BUILD npm run build
          run_step VERIFY_POST node tools/verify-transport-repeat-visit-v2.mjs
          exit 0

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f repeat-visit-v2-workflow.log ]; then git rm -f repeat-visit-v2-workflow.log; fi
          git add \
            app/transport/board/page.jsx \
            app/transport/board/modules/inbox.jsx \
            app/transport/pranimi/page.jsx \
            app/dispatch/page.jsx \
            tools/apply-transport-repeat-visit-v2.mjs \
            tools/fix-transport-repeat-visit-v2-idempotence.mjs \
            tools/fix-transport-repeat-visit-v2-bootstrap.mjs \
            tools/verify-transport-repeat-visit-v2.mjs \
            tools/apply-gati-rack-save-v1.mjs \
            tools/apply-arka-daily-close-v2.mjs \
            tools/verify-arka-daily-close-v2.mjs \
            package.json \
            vite.config.js \
            lib/appEpoch.js \
            index.html
          if git diff --cached --quiet; then
            echo "No generated source changes to commit."
          else
            git commit -m "fix repeat client pickup visits and planned carpet display V2"
            git push origin HEAD:main
          fi
