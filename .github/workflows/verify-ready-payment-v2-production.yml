name: Verify ready-or-payment bonus v2 production

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'tools/apply-base-ready-or-payment-bonus-v2-final.mjs'
      - 'tools/verify-base-ready-or-payment-bonus-v2-final.mjs'
      - '.github/workflows/verify-ready-payment-v2-production.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-ready-payment-v2-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Record verified state
        shell: bash
        run: |
          set -euo pipefail
          cat > READY_PAYMENT_BONUS_V2_VERIFIED.md <<EOF
          # Ready-or-payment bonus v2 verified

          Full production build passed for commit \`${GITHUB_SHA}\`.

          Policy verified by the build:
          - one bonus per BASE order;
          - GATI within 48 hours qualifies;
          - verified full BASE payment within 48 hours qualifies;
          - partial payment does not claim the completion bonus;
          - the first qualifying action owns the bonus;
          - the available bonus remains deductible from the worker's cash handoff.

          Verified at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          rm -f .github/workflows/verify-ready-payment-v2-production.yml
          rm -f .github/workflows/activate-ready-or-payment-bonus-v2-final.yml
          rm -f .github/workflows/finish-ready-or-payment-bonus-v2-20260804.yml
          git config user.name 'ready-payment-bonus-verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'record verified ready-or-payment bonus v2 build' || exit 0
          git push origin HEAD:main
