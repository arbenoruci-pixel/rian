name: One-time ship transport repeat visit V1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-ship-transport-repeat-visit-v1.yml

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply repeat-visit safe transport flow
        run: node tools/apply-transport-repeat-visit-v1.mjs

      - name: Verify repeat-visit source
        run: node tools/verify-transport-repeat-visit-v1.mjs

      - name: Run full production build and all safeguards
        run: npm run build

      - name: Verify final generated source
        run: node tools/verify-transport-repeat-visit-v1.mjs

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/transport/board/page.jsx \
            app/transport/board/modules/inbox.jsx \
            app/transport/pranimi/page.jsx \
            app/dispatch/page.jsx \
            tools/apply-transport-repeat-visit-v1.mjs \
            tools/verify-transport-repeat-visit-v1.mjs \
            tools/apply-gati-rack-save-v1.mjs \
            tools/apply-arka-daily-close-v2.mjs \
            tools/verify-arka-daily-close-v2.mjs \
            package.json \
            vite.config.js \
            lib/appEpoch.js \
            index.html
          if git diff --cached --quiet; then
            echo "No generated source changes to commit."
          else
            git commit -m "fix repeat client pickup visits and planned carpet display"
            git push origin HEAD:main
          fi
