name: One-time ship ARKA daily expense step V1

# Retry 3: synchronize later fast-close/GATI version owners before the full build.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-ship-arka-daily-expense-step-v1.yml

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply, build, verify, and persist diagnostics
        shell: bash
        run: |
          set +e
          LOG="arka-daily-expense-step-v1-workflow.log"
          : > "$LOG"

          echo "===== APPLY =====" >> "$LOG"
          node tools/apply-arka-daily-expense-step-v1.mjs >> "$LOG" 2>&1
          RC=$?

          if [ "$RC" -eq 0 ]; then
            node tools/sync-arka-daily-expense-version-owner-v1.mjs >> "$LOG" 2>&1
            RC=$?
          fi

          if [ "$RC" -eq 0 ]; then
            echo "===== BUILD =====" >> "$LOG"
            npm run build >> "$LOG" 2>&1
            RC=$?
          fi

          if [ "$RC" -eq 0 ]; then
            echo "===== FINAL VERIFY =====" >> "$LOG"
            node tools/verify-arka-daily-expense-step-v1.mjs >> "$LOG" 2>&1
            RC=$?
          fi

          echo "FINAL_RC=$RC" >> "$LOG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LOG"

          if [ "$RC" -eq 0 ]; then
            git add \
              components/ArkaDailyCloseWizard.jsx \
              tools/apply-arka-daily-expense-step-v1.mjs \
              tools/verify-arka-daily-expense-step-v1.mjs \
              tools/sync-arka-daily-expense-version-owner-v1.mjs \
              tools/apply-gati-rack-save-v1.mjs \
              tools/apply-arka-daily-close-v2.mjs \
              tools/verify-arka-daily-close-v2.mjs \
              tools/apply-unified-arka-payroll-v1.mjs \
              tools/apply-transport-repeat-visit-v2.mjs \
              tools/apply-pastrimi-payment-fast-close-v4.mjs \
              package.json \
              vite.config.js \
              lib/appEpoch.js \
              index.html
          fi

          if ! git diff --cached --quiet; then
            if [ "$RC" -eq 0 ]; then
              git commit -m "make daily-close expenses visible and actionable"
            else
              git commit -m "diagnose ARKA daily expense step V1 failure"
            fi
            git push origin HEAD:main
          fi

          exit "$RC"
