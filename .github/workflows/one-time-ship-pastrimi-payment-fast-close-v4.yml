name: One-time ship PASTRIMI payment fast close V4

# Retry with a committed diagnostic log if any safeguard or production build fails.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-ship-pastrimi-payment-fast-close-v4.yml

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply, full-build and verify with diagnostics
        shell: bash
        run: |
          set +e
          LOG=/tmp/pastrimi-fast-close-v4.log
          : > "$LOG"
          run_step() {
            echo "===== $1 =====" | tee -a "$LOG"
            shift
            "$@" >> "$LOG" 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "FAILED rc=$rc" | tee -a "$LOG"
              cp "$LOG" pastrimi-fast-close-v4-workflow.log
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add pastrimi-fast-close-v4-workflow.log
              git commit -m "diagnose PASTRIMI payment fast close V4 failure" || true
              git push origin HEAD:main || true
              exit $rc
            fi
          }
          run_step APPLY node tools/apply-pastrimi-payment-fast-close-v4.mjs
          run_step BUILD npm run build
          run_step VERIFY_POST node tools/verify-pastrimi-payment-fast-close-v4.mjs
          exit 0

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f pastrimi-fast-close-v4-workflow.log ]; then git rm -f pastrimi-fast-close-v4-workflow.log; fi
          git add \
            app/pastrimi/page.jsx \
            components/PosModal.jsx \
            tools/apply-pastrimi-payment-fast-close-v4.mjs \
            tools/verify-pastrimi-payment-fast-close-v4.mjs \
            tools/apply-gati-rack-save-v1.mjs \
            tools/apply-arka-daily-close-v2.mjs \
            tools/verify-arka-daily-close-v2.mjs \
            tools/apply-unified-arka-payroll-v1.mjs \
            tools/apply-transport-repeat-visit-v2.mjs \
            package.json \
            vite.config.js \
            lib/appEpoch.js \
            index.html
          if git diff --cached --quiet; then
            echo "No generated source changes to commit."
          else
            git commit -m "close PASTRIMI payments immediately and sync in background"
            git push origin HEAD:main
          fi
