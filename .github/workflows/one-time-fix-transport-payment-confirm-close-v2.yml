name: One-time fix transport payment confirm and close v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-fix-transport-payment-confirm-close-v2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run corrected payment repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('.github/workflows/one-time-fix-transport-payment-confirm-close-v1.yml')
          lines = source_path.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == 'run: |')
          base_indent = len(lines[start]) - len(lines[start].lstrip())
          block = []
          for line in lines[start + 1:]:
              if not line.strip():
                  block.append('')
                  continue
              indent = len(line) - len(line.lstrip())
              if indent <= base_indent:
                  break
              block.append(line)
          min_indent = min(len(line) - len(line.lstrip()) for line in block if line.strip())
          script = '\n'.join(line[min_indent:] if line.strip() else '' for line in block) + '\n'
          script = script.replace(
              "pkg['version'] = version",
              "pkg['version'] = '2.0.115-query-authority-transport-guard-v4'",
          )
          script = script.replace(
              'rm .github/workflows/one-time-fix-transport-payment-confirm-close-v1.yml',
              'rm .github/workflows/one-time-fix-transport-payment-confirm-close-v1.yml .github/workflows/one-time-fix-transport-payment-confirm-close-v2.yml',
          )
          script = script.replace(
              '.github/workflows/one-time-fix-transport-payment-confirm-close-v1.yml\ngit commit',
              '.github/workflows/one-time-fix-transport-payment-confirm-close-v1.yml .github/workflows/one-time-fix-transport-payment-confirm-close-v2.yml\ngit commit',
          )
          Path('/tmp/apply-transport-payment-fix-v2.sh').write_text(script)
          PY
          bash /tmp/apply-transport-payment-fix-v2.sh
