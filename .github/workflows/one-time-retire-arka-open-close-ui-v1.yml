name: Retire legacy ARKA runtime

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-retire-arka-open-close-ui-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch active runtime
        run: python3 scripts/retire_legacy_arka_runtime.py

      - name: Verify diff
        run: git diff --check

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/arka/page.jsx app/arka/layout.jsx src/generated/routes.generated.jsx
          git commit -m "fix: restore direct ARKA flow and retire daily open-close UI"
          git pull --rebase origin main
          git push origin main
