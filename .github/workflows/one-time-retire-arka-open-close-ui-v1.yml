name: One-time retire legacy ARKA open-close UI v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-retire-arka-open-close-ui-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Retire the daily-close route from active runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/generated/routes.generated.jsx')
          s = p.read_text()
          original = s

          s = s.replace(
            "import ArkaDitorePageEager from '@/app/arka/ditore/page.jsx';\n",
            ''
          )
          s = s.replace(
            "  { path: '/arka/ditore', element: eagerElement(ArkaDitorePageEager, '/arka/ditore') },",
            "  { path: '/arka/ditore', element: <Navigate to='/arka' replace /> },"
          )

          if 'ArkaDitorePageEager' in s:
            raise SystemExit('ArkaDitorePageEager still exists in routing truth')
          if "{ path: '/arka/ditore', element: <Navigate to='/arka' replace /> }" not in s:
            raise SystemExit('Safe /arka/ditore redirect was not installed')
          if s == original:
            raise SystemExit('Routing truth was already unchanged; inspect manually')

          p.write_text(s)
          PY

      - name: Prove active UI no longer exposes open-close
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path('app'), Path('components'), Path('src'), Path('lib')]
          extensions = {'.js', '.jsx', '.ts', '.tsx'}
          archived = {
            Path('app/arka/ditore/page.jsx'),
            Path('components/ArkaDailyCloseShortcut.jsx'),
            Path('components/ArkaDailyCloseWizard.jsx'),
          }
          forbidden = (
            'ArkaDitorePageEager',
            'ArkaDailyCloseShortcut',
            'ArkaDailyCloseWizard',
            'MBYLLJA DITORE',
            'get_arka_daily_close_preview_v2',
            'get_arka_daily_close_preview_v3',
            'get_arka_daily_close_preview_v4',
            'close_arka_day_v2',
            'add_arka_closed_day_expense_v1',
            'arka_open_cycle_safe',
          )
          bad = []
          route_path = Path('src/generated/routes.generated.jsx')

          for root in roots:
            if not root.exists():
              continue
            for p in root.rglob('*'):
              if not p.is_file() or p.suffix not in extensions or p in archived:
                continue
              for i, line in enumerate(p.read_text().splitlines(), 1):
                if any(token in line for token in forbidden):
                  bad.append(f'{p}:{i}: {line.strip()}')
                if '/arka/ditore' in line:
                  allowed = (
                    p == route_path
                    and "path: '/arka/ditore'" in line
                    and "<Navigate to='/arka' replace />" in line
                  )
                  if not allowed:
                    bad.append(f'{p}:{i}: {line.strip()}')

          if bad:
            raise SystemExit('Active legacy ARKA references remain:\n' + '\n'.join(bad[:200]))
          print('Verified: old ARKA open-close is absent from active runtime; old URL safely redirects to /arka.')
          PY

      - name: Commit route retirement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/routes.generated.jsx
          git commit -m "fix: retire legacy arka daily-close route"
          git push origin main
