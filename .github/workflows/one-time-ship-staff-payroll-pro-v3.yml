name: One-time ship staff payroll pro v3

on:
  workflow_dispatch:
  push:
    branches:
      - feature/staff-payroll-pro-v3
    paths:
      - .github/workflows/one-time-ship-staff-payroll-pro-v3.yml

permissions:
  contents: write

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/staff-payroll-pro-v3
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply existing build owners, then staff/payroll pro patch
        run: |
          npm run prebuild
          node tools/apply-staff-payroll-pro-v3.mjs

      - name: Full regression build without a second prebuild lifecycle
        shell: bash
        run: |
          set -euo pipefail
          BUILD_COMMAND="$(node -p "require('./package.json').scripts.build")"
          bash -euo pipefail -c "$BUILD_COMMAND"

      - name: Extra syntax and focused verification
        run: |
          node --check api/arka/worker-control.js
          node --check lib/arka/workerControlClient.js
          node --check tools/apply-staff-payroll-pro-v3.mjs
          npm run test:staff-payroll-pro-v3

      - name: Commit generated, tested source to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            api/auth/login.js \
            api/arka/worker-control.js \
            app/arka/payroll/page.jsx \
            app/arka/puntor/'[pin]'/page.jsx \
            app/arka/stafi/page.jsx \
            components/WorkerControlCenter.jsx \
            index.html \
            lib/appEpoch.js \
            lib/arka/workerControlClient.js \
            package.json \
            server/index.mjs \
            supabase/migrations/20260904160000_staff_payroll_pro_v3.sql \
            tools/apply-staff-payroll-pro-v3.mjs \
            tools/verify-staff-payroll-pro-v3.mjs \
            vite.config.js
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Build professional staff payroll worker cards"
            git push origin HEAD:feature/staff-payroll-pro-v3
          fi
