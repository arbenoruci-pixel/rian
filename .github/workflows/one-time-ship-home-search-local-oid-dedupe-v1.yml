name: One-time ship Home search local_oid dedupe V1

# Trigger 4: ARKA verifier accepts compatible service-worker generations 3512+.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-ship-home-search-local-oid-dedupe-v1.yml

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply, build, verify, and persist diagnostics
        shell: bash
        run: |
          set +e
          LOG="home-search-local-oid-dedupe-v1-workflow.log"
          : > "$LOG"

          echo "===== APPLY =====" >> "$LOG"
          node tools/apply-home-search-local-oid-dedupe-v1.mjs >> "$LOG" 2>&1
          RC=$?

          if [ "$RC" -eq 0 ]; then
            echo "===== BUILD =====" >> "$LOG"
            npm run build >> "$LOG" 2>&1
            RC=$?
          fi

          if [ "$RC" -eq 0 ]; then
            echo "===== FINAL VERIFY =====" >> "$LOG"
            node tools/verify-home-search-local-oid-dedupe-v1.mjs >> "$LOG" 2>&1
            RC=$?
          fi

          echo "FINAL_RC=$RC" >> "$LOG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LOG"

          if [ "$RC" -eq 0 ]; then
            git add \
              lib/homeSearch.js \
              tools/apply-home-search-local-oid-dedupe-v1.mjs \
              tools/verify-home-search-local-oid-dedupe-v1.mjs \
              tools/apply-pastrimi-payment-fast-close-v4.mjs \
              tools/apply-gati-rack-save-v1.mjs \
              tools/apply-arka-daily-close-v2.mjs \
              tools/verify-arka-daily-close-v2.mjs \
              package.json \
              vite.config.js \
              lib/appEpoch.js \
              index.html
          fi

          if ! git diff --cached --quiet; then
            if [ "$RC" -eq 0 ]; then
              git commit -m "dedupe Home search by stable local order identity"
            else
              git commit -m "diagnose Home search local-order dedupe failure"
            fi
            git push origin HEAD:main
          fi

          exit "$RC"
