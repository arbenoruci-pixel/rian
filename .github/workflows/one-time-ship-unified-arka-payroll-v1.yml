name: One-time ship unified ARKA payroll V1

# Retry 2: legacy Beli installer accepts the canonical fast-payment flow.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-ship-unified-arka-payroll-v1.yml

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make legacy installers compatible with the unified payment path
        run: node tools/apply-unified-arka-payroll-compat-v1.mjs

      - name: Apply unified ARKA, staff, payroll and payment flow
        run: node tools/apply-unified-arka-payroll-v1.mjs

      - name: Run full production build and all existing safeguards
        run: npm run build

      - name: Verify final unified source
        run: node tools/verify-unified-arka-payroll-v1.mjs

      - name: Commit verified generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/arka/page.jsx \
            'app/arka/puntor/[pin]/page.jsx' \
            app/arka/stafi/page.jsx \
            app/arka/payroll/page.jsx \
            app/transport/pay/page.jsx \
            components/ArkaUnifiedWorkerAccount.jsx \
            components/WorkerCompensationEditor.jsx \
            components/ArkaWorkerDailyStatus.jsx \
            components/ReadyBonusLiveCard.jsx \
            lib/payrollMonthClose.js \
            tools/apply-unified-arka-payroll-v1.mjs \
            tools/apply-unified-arka-payroll-compat-v1.mjs \
            tools/verify-unified-arka-payroll-v1.mjs \
            tools/apply-beli-straight-salary-payment-recovery-v1.mjs \
            tools/verify-beli-straight-salary-payment-recovery-v1.mjs \
            tools/apply-gati-rack-save-v1.mjs \
            tools/apply-arka-daily-close-v2.mjs \
            tools/verify-arka-daily-close-v2.mjs \
            package.json \
            vite.config.js \
            lib/appEpoch.js \
            index.html
          if git diff --cached --quiet; then
            echo "No generated source changes to commit."
          else
            git commit -m "unify ARKA worker views and link compensation to payroll"
            git push origin HEAD:main
          fi
