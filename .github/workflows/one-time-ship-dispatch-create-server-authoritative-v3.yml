name: One-time ship Dispatch server-authoritative create v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-ship-dispatch-create-server-authoritative-v3.yml'
      - 'tools/apply-dispatch-create-server-authoritative-v3.mjs'
      - 'tools/apply-dispatch-authoritative-build-compat-v3.mjs'
      - 'tools/verify-dispatch-create-intent-v1.mjs'

permissions:
  contents: write

concurrency:
  group: one-time-ship-dispatch-create-server-authoritative-v3
  cancel-in-progress: false

jobs:
  patch-test-ship:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Apply authoritative create patch
        run: |
          node --check tools/apply-dispatch-create-server-authoritative-v3.mjs
          node tools/apply-dispatch-create-server-authoritative-v3.mjs
          node --check tools/apply-dispatch-authoritative-build-compat-v3.mjs
          node tools/apply-dispatch-authoritative-build-compat-v3.mjs

      - name: Verify critical invariants
        run: |
          grep -q 'DISPATCH_CREATE_SERVER_AUTHORITATIVE_V3' app/dispatch/page.jsx
          grep -q 'const canCreateNewDispatchOrder = canSend;' app/dispatch/page.jsx
          grep -q 'server_atomic_create' app/dispatch/page.jsx
          grep -q 'const orderId = await createIntentJournalRef.current.acquire(' app/dispatch/page.jsx
          grep -q 'pendingOrderId = orderId;' app/dispatch/page.jsx
          grep -q 'DISPATCH_AUTHORITATIVE_BUILD_COMPAT_V3' tools/apply-dispatch-phone-check-resilience-v2.mjs
          if grep -q 'if (!phoneCheckReady)' app/dispatch/page.jsx; then
            echo 'Blocking phoneCheckReady gate still present in send()'
            exit 1
          fi
          if grep -q 'if (phoneHit && !existingClientConfirmed)' app/dispatch/page.jsx; then
            echo 'Blocking existing-client confirmation gate still present in send()'
            exit 1
          fi
          if grep -q 'let submitPhoneCheckDegraded = false;' app/dispatch/page.jsx; then
            echo 'Redundant submit-time phone precheck still present'
            exit 1
          fi
          node --check lib/transport/transportDb.js
          node --check lib/transport/dispatchOrderServer.js
          node tools/verify-dispatch-phone-check-resilience-v2.mjs
          node tools/verify-dispatch-create-intent-v1.mjs

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit and push source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dispatch/page.jsx tools/apply-dispatch-phone-check-resilience-v2.mjs tools/verify-dispatch-phone-check-resilience-v2.mjs
          if git diff --cached --quiet; then
            echo 'Patch already present.'
            exit 0
          fi
          git commit -m "fix: make Dispatch create server-authoritative"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
